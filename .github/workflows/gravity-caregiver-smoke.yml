name: Monarch caregiver smoke tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  caregiver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monarch prototype
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile questionnaire modules
        run: |
          python -m py_compile \
            Home.py \
            monarch/questionnaire/definitions.py \
            monarch/questionnaire/choices.py \
            monarch/questionnaire/scope.py \
            monarch/questionnaire/response_adapter.py \
            monarch/questionnaire/renderer.py \
            monarch/glossary.py \
            monarch/disco/config.py \
            monarch/disco/engine.py \
            monarch/disco/cadence.py \
            monarch/disco/artifacts.py \
            monarch/disco/feedback.py \
            monarch/disco/guidance.py \
            doc_history/__init__.py \
            doc_history/extractor.py \
            pages/30_DiScO_Text_Evaluator.py \
            pages/31_Disco_Fever.py \
            pages/32_Discotorium.py \
            connectathon/gravity_questionnaire.py \
            connectathon/gravity_response.py \
            pages/10_Gravity_Caregiver_Health.py

      - name: Run caregiver tests
        run: |
          python -m pytest -q \
            tests/test_gravity_caregiver.py \
            tests/test_gravity_hl7v2.py \
            tests/test_gravity_caregiver_streamlit.py \
            tests/test_monarch_questionnaire.py \
            tests/test_monarch_glossary_streamlit.py \
            tests/test_monarch_disco.py \
            tests/test_monarch_home.py
